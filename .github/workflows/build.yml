name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build and package
        shell: pwsh
        run: ./build-release.ps1 -SkipTests
      - uses: actions/upload-artifact@v4
        with:
          name: DSC-Sync-Local
          path: dist/DSC-Sync-Local/
      - uses: actions/upload-artifact@v4
        with:
          name: DSC-Sync-Remote
          path: dist/DSC-Sync-Remote/
      - name: Tests (simulated token)
        timeout-minutes: 10
        continue-on-error: true
        shell: pwsh
        run: dotnet test tests/DSC-Sync.Tests -c Release --blame-hang-timeout 3m --logger "console;verbosity=normal"
      - name: Upload hang dumps / test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: tests/**/TestResults/
